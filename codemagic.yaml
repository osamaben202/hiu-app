workflows:
  hiu-android:
    name: HIU Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      android_signing:
        - keystore_reference: HIU_KEYSTORE
      vars:
        PACKAGE_NAME: "com.hiu.app"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Get Flutter packages
        script: |
          cd frontend
          flutter pub get

      - name: Build APK
        script: |
          cd frontend
          flutter build apk --release

    artifacts:
      - frontend/build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
